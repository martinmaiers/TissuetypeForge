# Idealized second-field molecular typing.
#
# Baseline convenience model: reports the first two nomenclature fields of
# truth (spec §5). NOT an empirical assay. No interlocus phase retained.
name = "second_field"
description = "Idealized second-field typing, independent per locus (no phase)."
reference_database = "IPD-IMGT/HLA 3.55.0"

[defaults]
typed = true
assay_class = "idealized"
resolution = "second_field"
failure_probability = 0.0
error_probability = 0.0
