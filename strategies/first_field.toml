# Idealized first-field molecular typing.
#
# Baseline convenience model: reports the first nomenclature field of truth
# (spec §5). NOT an empirical assay. No interlocus phase is retained (each
# locus typed independently), so no phase_groups are declared.
name = "first_field"
description = "Idealized first-field typing, independent per locus (no phase)."
reference_database = "IPD-IMGT/HLA 3.55.0"

[defaults]
typed = true
assay_class = "idealized"
resolution = "first_field"
failure_probability = 0.0
error_probability = 0.0
