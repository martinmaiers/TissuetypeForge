# Mixed-resolution, mixed-assay registry typing (Decision 4): different assay
# classes across loci in one strategy.
#   HLA-A : idealized second-field (M1 path, no reference needed)
#   HLA-B : sequence SBT exon2+3
#   HLA-C : serology, split level
#   HLA-DQB1 : not typed (missing)
name = "mixed_assay_registry"
description = "Per-locus mixed assay classes: idealized + SBT + serology."
reference_policy = "strict"

[defaults]
typed = true
assay_class = "idealized"
resolution = "second_field"

[loci.HLA-B]
assay_class = "sbt"
resolution = "second_field"
reference_name = "TOY-GEN"
interrogated_features = ["exon2", "exon3"]

[loci.HLA-C]
assay_class = "serology"
resolution = "serology"
reference_name = "TOY-SER"
serology_level = "split"
reference_policy = "permissive"

[loci.HLA-DQB1]
typed = false
