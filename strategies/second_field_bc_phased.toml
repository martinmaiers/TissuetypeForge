# Second-field typing that resolves B~C haplotype phase.
#
# Demonstrates explicit phase retention (spec §6): the B and C loci are reported
# in a single phased block when truth phases them together; all other loci are
# reported independently with no interlocus phase.
name = "second_field_bc_phased"
description = "Idealized second-field typing; retains B~C interlocus phase."
reference_database = "IPD-IMGT/HLA 3.55.0"

[defaults]
typed = true
assay_class = "idealized"
resolution = "second_field"
failure_probability = 0.0
error_probability = 0.0

[[phase_groups]]
loci = ["HLA-B", "HLA-C"]
