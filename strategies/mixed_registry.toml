# Mixed-resolution registry typing (spec §3): resolution and coverage differ
# across loci. A, B, DRB1 at second field; C at first field; DQB1 not typed.
# Idealized modes only (M1).
name = "mixed_registry"
description = "Mixed per-locus resolution and coverage, idealized (M1)."
reference_database = "IPD-IMGT/HLA 3.55.0"

[defaults]
typed = true
assay_class = "idealized"
resolution = "second_field"

[loci.HLA-C]
resolution = "first_field"

[loci.HLA-DQB1]
typed = false
