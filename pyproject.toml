[project]
name = "tissuetypeforge"
version = "0.1.0"
description = "Simulate HLA typing observations from known genetic truth."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Society for Immune Polymorphism (SIP)" }]
keywords = ["HLA", "immunogenetics", "GL String", "typing", "simulation"]
dependencies = ["glstring>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tissuetypeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
"examples/*" = ["N806"]
